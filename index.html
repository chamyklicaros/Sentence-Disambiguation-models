<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentence Disambiguation</title>
  <link rel="stylesheet" href="web/style.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Sentence disambiguation</h1>
      <p>Split Taglish text into individual sentences using ML models</p>
    </div>

    <div class="card">
      <label for="sentence">Input text</label>
      <div class="input-wrap">
        <input type="text" id="sentence" placeholder="Type Taglish text here…">
        <button class="send-btn" onclick="analyze()" aria-label="Analyze">&#8594;</button>
      </div>

      <label style="margin-top:1.25rem;">Model</label>
      <div class="model-row">
        <div class="model-opt active" data-val="sat" onclick="selectModel(this)">
          <div class="name">SaT</div>
          <div class="desc">12-layer, general</div>
        </div>
        <div class="model-opt" data-val="pysbd" onclick="selectModel(this)">
          <div class="name">PySBD</div>
          <div class="desc">Rule-based, fast</div>
        </div>
        <div class="model-opt" data-val="sat_finetuned" onclick="selectModel(this)">
          <div class="name">SaT fine-tuned</div>
          <div class="desc">Taglish-specific</div>
        </div>
      </div>

      <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">
        <div class="spinner"></div>
        <span class="btn-text">Analyze</span>
      </button>

      <div class="error-banner" id="errorBanner"></div>
    </div>

    <div class="results" id="results">
      <div class="results-header">
        <span class="results-title">Sentences found</span>
        <span class="badge" id="badge"></span>
      </div>
      <div id="sentence-list"></div>
    </div>
  </div>

  <script src="web/script.js"></script>
</body>
</html>
